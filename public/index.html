<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐉 Monster Lab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- TELA: Entrada -->
  <div id="tela-entrada" class="tela ativa">
    <div class="card">
      <div class="logo">🐉</div>
      <h1>Monster Lab</h1>
      <p class="subtitulo">Crie seu monstro. Domine a arena.</p>
      <input id="input-nome" type="text" placeholder="Seu nome" maxlength="20" />
      <input id="input-sala" type="text" placeholder="Código da sala (ex: ARENA)" maxlength="12" />
      <button id="btn-entrar">Entrar na Sala</button>
      <p id="msg-erro" class="erro hidden"></p>
    </div>
  </div>

  <!-- TELA: Lobby -->
  <div id="tela-lobby" class="tela">
    <div class="card">
      <h2>Sala <span id="nome-sala" class="destaque"></span></h2>
      <p class="info" id="info-lobby">Aguardando jogadores...</p>
      <ul id="lista-lobby"></ul>
      <button id="btn-pronto">⚗️ Estou Pronto!</button>
    </div>
  </div>

  <!-- TELA: Criação -->
  <div id="tela-criacao" class="tela">
    <div class="criacao-layout">
      <div class="criacao-header">
        <h2>🧪 Monte seu Monstro</h2>
        <div class="timer-criacao">⏱ <span id="timer-num">60</span>s</div>
      </div>

      <div class="criacao-corpo">
        <!-- Painel esquerdo: seleção de peças -->
        <div class="painel-pecas">
          <div class="nome-monster-row">
            <input id="input-nome-monster" type="text" placeholder="Nome do seu monstro" maxlength="25" />
          </div>

          <div id="slots-container"></div>
        </div>

        <!-- Painel direito: preview do monstro -->
        <div class="painel-preview">
          <div class="monster-card" id="preview-card">
            <div class="monster-emoji-area" id="preview-emojis">❓❓❓</div>
            <div class="monster-nome" id="preview-nome">?????</div>
            <div class="monster-stats" id="preview-stats">
              <div class="stat"><span class="stat-label">❤️ Vida</span><span id="stat-hp">—</span></div>
              <div class="stat"><span class="stat-label">⚔️ Ataque</span><span id="stat-atk">—</span></div>
              <div class="stat"><span class="stat-label">🛡️ Defesa</span><span id="stat-def">—</span></div>
              <div class="stat"><span class="stat-label">⚡ Velocidade</span><span id="stat-spd">—</span></div>
            </div>
            <div id="preview-combos" class="combo-list"></div>
          </div>
          <button id="btn-confirmar" disabled>✅ Confirmar Monstro</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TELA: Revelação -->
  <div id="tela-revelacao" class="tela">
    <div class="card wide">
      <h2>⚔️ Os Monstros Foram Criados!</h2>
      <div id="grid-monstros"></div>
    </div>
  </div>

  <!-- TELA: Combate -->
  <div id="tela-combate" class="tela">
    <div class="card wide">
      <h2>🏟️ Arena</h2>
      <div class="vs-header">
        <span id="nome-fighter-a" class="fighter-nome"></span>
        <span class="vs-label">VS</span>
        <span id="nome-fighter-b" class="fighter-nome"></span>
      </div>
      <div class="hp-bars">
        <div class="hp-bar-wrap">
          <div class="hp-fill" id="hp-bar-a"></div>
        </div>
        <div class="hp-bar-wrap">
          <div class="hp-fill" id="hp-bar-b"></div>
        </div>
      </div>
      <div id="log-combate"></div>
      <div class="progresso-torneio">
        Batalha <span id="batalha-atual">1</span> de <span id="batalha-total">1</span>
      </div>
    </div>
  </div>

  <!-- TELA: Resultado -->
  <div id="tela-resultado" class="tela">
    <div class="card">
      <h2>🏆 Resultado Final</h2>
      <div id="ranking"></div>
      <button id="btn-jogar-novamente">Jogar Novamente</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
