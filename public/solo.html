<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🐉 Monster Lab — Solo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--card:#111827;--border:#1e2d40;
  --accent:#22c55e;--accent2:#f59e0b;--danger:#ef4444;
  --text:#e2e8f0;--muted:#64748b;--rare:#a855f7;--legendary:#f59e0b;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse at 20% 50%,rgba(34,197,94,.04) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(168,85,247,.06) 0%,transparent 60%)}
.tela{display:none;width:100%;padding:16px;justify-content:center}
.tela.ativa{display:flex}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:32px 28px;text-align:center;box-shadow:0 8px 48px rgba(0,0,0,.5);
  width:100%;max-width:520px}
.card.wide{max-width:800px}
h1{font-size:2.2rem;font-weight:800;color:var(--accent2);margin-bottom:6px}
h2{font-size:1.5rem;font-weight:700;color:var(--accent2);margin-bottom:16px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.info{color:var(--muted);font-size:.85rem;margin:6px 0}
input[type=text]{width:100%;padding:12px 16px;margin:7px 0;background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;
  font-family:inherit;outline:none;transition:border-color .2s}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]::placeholder{color:var(--muted)}
button{width:100%;padding:13px;margin-top:10px;background:var(--accent);color:#0a0e1a;
  border:none;border-radius:10px;font-size:1rem;font-weight:700;font-family:inherit;
  cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:#16a34a}
button:active{transform:scale(.98)}
button:disabled{background:#1e2d40;color:var(--muted);cursor:not-allowed}
.btn-roxo{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff}
.btn-roxo:hover{background:linear-gradient(135deg,#6d28d9,#9333ea)}

/* Draft */
.draft-layout{display:flex;gap:0;width:100%;max-width:860px;
  background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.draft-header{display:flex;justify-content:space-between;align-items:center;
  padding:18px 24px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.draft-header h2{margin:0}
.rl-badge{font-size:.8rem;font-weight:700;color:var(--rare);
  background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);
  padding:4px 12px;border-radius:99px}
.draft-body{display:flex}
.painel-pecas{flex:1;padding:20px 24px;border-right:1px solid var(--border);
  overflow-y:auto;max-height:calc(100vh - 120px)}
.nome-row{margin-bottom:18px}
.slot-grupo{margin-bottom:18px}
.slot-titulo{font-size:.72rem;font-weight:700;letter-spacing:1px;color:var(--muted);
  text-transform:uppercase;margin-bottom:8px}
.slot-opcoes{display:flex;flex-wrap:wrap;gap:7px}
.peca-btn{display:flex;flex-direction:column;align-items:center;padding:9px 11px;gap:3px;
  background:rgba(255,255,255,.03);border:2px solid var(--border);border-radius:10px;
  cursor:pointer;min-width:76px;text-align:center;
  width:auto;margin:0;font-weight:400;color:var(--text);font-size:.72rem;transition:all .15s}
.peca-btn:hover{border-color:var(--accent);background:rgba(34,197,94,.06)}
.peca-btn.sel{border-color:var(--accent);background:rgba(34,197,94,.12)}
.peca-btn.rara{border-color:rgba(168,85,247,.35)}
.peca-btn.rara:hover,.peca-btn.rara.sel{border-color:var(--rare);background:rgba(168,85,247,.12)}
.peca-btn.lendaria{border-color:rgba(245,158,11,.35)}
.peca-btn.lendaria:hover,.peca-btn.lendaria.sel{border-color:var(--legendary);background:rgba(245,158,11,.1)}
.pe{font-size:1.5rem}.pn{font-size:.68rem;line-height:1.2}
.br{font-size:.58rem;padding:1px 4px;border-radius:4px}
.br.comum{background:rgba(148,163,184,.15);color:var(--muted)}
.br.rara{background:rgba(168,85,247,.2);color:var(--rare)}
.br.lendaria{background:rgba(245,158,11,.2);color:var(--legendary)}
.painel-prev{width:240px;flex-shrink:0;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.mcard{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:12px;padding:18px 16px;text-align:center}
.mcard-emoji{font-size:2rem;margin-bottom:8px;letter-spacing:4px}
.mcard-nome{font-size:.95rem;font-weight:700;color:var(--accent2);margin-bottom:12px}
.mcard-stats{display:flex;flex-direction:column;gap:6px}
.st{display:flex;justify-content:space-between;font-size:.82rem}
.sl{color:var(--muted)}

/* Zona / rodada */
.zona-header{font-size:1.2rem;font-weight:700;color:var(--accent2);margin-bottom:4px}
.rodada-info{font-size:.85rem;color:var(--muted);margin-bottom:18px}
.boss-av{color:var(--danger);font-weight:700}

/* VS */
.vs-pre{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.mvc{flex:1;min-width:160px;max-width:200px;background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:12px;padding:16px 12px;text-align:center}
.mvc.enemy{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.03)}
.mvc.boss{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.04)}
.mvc-emoji{font-size:2rem;margin-bottom:6px}
.mvc-nome{font-weight:700;color:var(--accent2);margin-bottom:8px;font-size:.9rem}
.mvc-stats{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.sp{font-size:.7rem;padding:3px 7px;border-radius:99px;background:rgba(255,255,255,.06)}
.vs-sep{font-size:2rem;font-weight:900;color:var(--danger);flex-shrink:0}

/* Combate */
.vs-h{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
.fn{font-size:1.1rem;font-weight:700}
.vs-l{font-size:1.4rem;font-weight:900;color:var(--danger)}
.hp-bars{display:flex;gap:10px;margin-bottom:14px}
.hp-wrap{flex:1;height:11px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.hp-fill{height:100%;width:100%;background:var(--accent);border-radius:99px;transition:width .3s,background .3s}
.hp-fill.low{background:var(--danger)}
#log{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;
  padding:8px;background:rgba(0,0,0,.3);border-radius:10px;scroll-behavior:smooth}
.ll{padding:4px 9px;border-radius:6px;font-size:.82rem;animation:si .2s ease}
.li{color:var(--accent2);font-weight:700;text-align:center}
.lt{color:var(--muted);font-size:.72rem;text-align:center;border-top:1px solid var(--border);padding-top:6px;margin-top:3px}
.la{color:var(--text)}
.ld{color:var(--danger);font-weight:600}
.lc{color:var(--accent)}
.le{color:var(--rare);font-style:italic}
.lm{color:var(--danger);font-weight:700;text-align:center}
.lf{color:var(--accent2);font-weight:700;text-align:center;font-size:.95rem}
.lb{color:#f97316;font-weight:700}

/* Recompensa */
.rc-grid{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.rc{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:11px;
  cursor:pointer;border:2px solid var(--border);background:rgba(255,255,255,.03);
  transition:all .15s;text-align:left}
.rc:hover{border-color:var(--accent);background:rgba(34,197,94,.07)}
.rc.reliquia{border-color:rgba(245,158,11,.35)}
.rc.reliquia:hover{border-color:var(--legendary);background:rgba(245,158,11,.07)}
.rc.peca_swap{border-color:rgba(168,85,247,.35)}
.rc.peca_swap:hover{border-color:var(--rare);background:rgba(168,85,247,.07)}
.re{font-size:1.8rem;flex-shrink:0}
.rl{font-weight:700;font-size:.92rem}
.rd{font-size:.78rem;color:var(--muted);margin-top:2px}

/* Banner */
.banner-ok{font-size:1.4rem;color:var(--accent);font-weight:700;margin-bottom:6px}
.banner-bad{font-size:2.2rem;margin-bottom:8px}
.banner-win{font-size:2.2rem;font-weight:900;color:var(--legendary);margin-bottom:8px}

.rel-lista{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;justify-content:center}
.rel-pip{font-size:.85rem;padding:3px 8px;background:rgba(245,158,11,.1);
  border-radius:6px;border:1px solid rgba(245,158,11,.2)}

@keyframes si{from{transform:translateX(-6px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pi{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
@media(max-width:680px){.draft-body{flex-direction:column}.painel-prev{width:100%;border-top:1px solid var(--border)}.painel-pecas{max-height:50vh}}
</style>
</head>
<body>

<div id="t-inicio" class="tela ativa">
  <div class="card">
    <div style="font-size:3.5rem;margin-bottom:8px">🐉</div>
    <h1>Monster Lab</h1>
    <p class="sub">Modo Solo — sem servidor necessário</p>
    <input id="inp-nome" type="text" placeholder="Seu nome" maxlength="20"/>
    <button id="btn-start" class="btn-roxo">⚔️ Iniciar Roguelike</button>
  </div>
</div>

<div id="t-draft" class="tela">
  <div class="draft-layout">
    <div class="draft-header">
      <h2>🧪 Escolha suas Peças</h2>
      <div class="rl-badge" id="badge-rodada">Rodada 1 de 9</div>
    </div>
    <div class="draft-body">
      <div class="painel-pecas">
        <div class="nome-row"><input id="inp-monster" type="text" placeholder="Nome do monstro" maxlength="25"/></div>
        <div id="draft-slots"></div>
      </div>
      <div class="painel-prev">
        <div class="mcard">
          <div class="mcard-emoji" id="prev-emoji">❓</div>
          <div class="mcard-nome"  id="prev-nome">?????</div>
          <div class="mcard-stats">
            <div class="st"><span class="sl">❤️ Vida</span>      <span id="ps-hp">—</span></div>
            <div class="st"><span class="sl">⚔️ Ataque</span>    <span id="ps-atk">—</span></div>
            <div class="st"><span class="sl">🛡️ Defesa</span>    <span id="ps-def">—</span></div>
            <div class="st"><span class="sl">⚡ Velocidade</span><span id="ps-spd">—</span></div>
          </div>
        </div>
        <button id="btn-draft-ok" disabled>⚔️ Batalhar!</button>
      </div>
    </div>
  </div>
</div>

<div id="t-pre" class="tela">
  <div class="card wide">
    <div class="zona-header"  id="pre-zona"></div>
    <div class="rodada-info"  id="pre-rodada"></div>
    <div class="vs-pre">
      <div class="mvc"         id="pre-meu"></div>
      <div class="vs-sep">VS</div>
      <div class="mvc enemy"   id="pre-ini"></div>
    </div>
    <p class="info" style="margin-top:14px">Batalha começando...</p>
  </div>
</div>

<div id="t-combate" class="tela">
  <div class="card wide">
    <h2>🏟️ Arena</h2>
    <div class="vs-h">
      <span class="fn" id="fn-a"></span>
      <span class="vs-l">VS</span>
      <span class="fn" id="fn-b"></span>
    </div>
    <div class="hp-bars">
      <div class="hp-wrap"><div class="hp-fill" id="hpb-a"></div></div>
      <div class="hp-wrap"><div class="hp-fill" id="hpb-b"></div></div>
    </div>
    <div id="log"></div>
  </div>
</div>

<div id="t-recomp" class="tela">
  <div class="card">
    <div class="banner-ok">✅ Vitória!</div>
    <h2>🎁 Escolha sua Recompensa</h2>
    <p class="info" id="rc-info"></p>
    <div id="rc-opcoes" class="rc-grid"></div>
  </div>
</div>

<div id="t-over" class="tela">
  <div class="card">
    <div class="banner-bad">💀 Derrotado!</div>
    <h2>Fim de Run</h2>
    <p class="info" id="over-info"></p>
    <div id="over-monster" class="mcard" style="margin:18px auto;max-width:260px"></div>
    <button id="btn-over">🔄 Nova Run</button>
  </div>
</div>

<div id="t-win" class="tela">
  <div class="card">
    <div class="banner-win">🏆 LENDÁRIO!</div>
    <h2>Você sobreviveu às 9 rodadas!</h2>
    <div id="win-monster" class="mcard" style="margin:18px auto;max-width:260px"></div>
    <button id="btn-win">🔄 Nova Run</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  DADOS: PEÇAS
// ════════════════════════════════════════════════════════
const BASE = {hp:50,atk:0,def:0,spd:0};
const PECAS = {
  cabeca_dragao:    {id:"cabeca_dragao",    slot:"cabeca",  nome:"Cabeça de Dragão",   emoji:"🐉",raridade:"rara",    tipo:"fogo",   stats:{hp:5, atk:15,def:0, spd:5 },descricao:"Sopro de fogo devastador."},
  cabeca_lobo:      {id:"cabeca_lobo",      slot:"cabeca",  nome:"Cabeça de Lobo",     emoji:"🐺",raridade:"comum",   tipo:null,     stats:{hp:5, atk:10,def:0, spd:10},descricao:"Uivo paralisante."},
  cabeca_cobra:     {id:"cabeca_cobra",     slot:"cabeca",  nome:"Cabeça de Cobra",    emoji:"🐍",raridade:"comum",   tipo:"veneno", stats:{hp:0, atk:8, def:0, spd:12},descricao:"Presas venenosas."},
  cabeca_aguia:     {id:"cabeca_aguia",     slot:"cabeca",  nome:"Cabeça de Águia",    emoji:"🦅",raridade:"comum",   tipo:null,     stats:{hp:0, atk:5, def:5, spd:15},descricao:"Visão aguçada."},
  cabeca_demonio:   {id:"cabeca_demonio",   slot:"cabeca",  nome:"Cabeça de Demônio",  emoji:"😈",raridade:"rara",    tipo:"sombra", stats:{hp:0, atk:20,def:0, spd:8 },descricao:"Terror absoluto."},
  cabeca_fenix:     {id:"cabeca_fenix",     slot:"cabeca",  nome:"Cabeça de Fênix",    emoji:"🔥",raridade:"lendaria",tipo:"fogo",   stats:{hp:15,atk:12,def:5, spd:8 },descricao:"Renascida das chamas."},
  corpo_ogro:       {id:"corpo_ogro",       slot:"corpo",   nome:"Corpo de Ogro",      emoji:"👹",raridade:"comum",   tipo:null,     stats:{hp:20,atk:0, def:5, spd:0 },descricao:"Massa muscular brutal."},
  corpo_cavaleiro:  {id:"corpo_cavaleiro",  slot:"corpo",   nome:"Corpo de Cavaleiro", emoji:"⚔️",raridade:"comum",   tipo:"luz",    stats:{hp:10,atk:5, def:10,spd:0 },descricao:"Armadura impenetrável."},
  corpo_aranha:     {id:"corpo_aranha",     slot:"corpo",   nome:"Corpo de Aranha",    emoji:"🕷️",raridade:"comum",   tipo:"veneno", stats:{hp:5, atk:5, def:3, spd:8 },descricao:"Ágil e mortal."},
  corpo_troll:      {id:"corpo_troll",      slot:"corpo",   nome:"Corpo de Troll",     emoji:"🧌",raridade:"rara",    tipo:null,     stats:{hp:35,atk:0, def:8, spd:-5},descricao:"Regeneração sobrenatural.",efeito:"regeneracao"},
  corpo_demonio:    {id:"corpo_demonio",    slot:"corpo",   nome:"Corpo de Demônio",   emoji:"🔱",raridade:"rara",    tipo:"sombra", stats:{hp:15,atk:10,def:5, spd:0 },descricao:"Poder das trevas."},
  corpo_leviata:    {id:"corpo_leviata",    slot:"corpo",   nome:"Corpo de Leviatã",   emoji:"🌊",raridade:"lendaria",tipo:null,     stats:{hp:40,atk:0, def:10,spd:0 },descricao:"Resistência colossal."},
  membros_garras:   {id:"membros_garras",   slot:"membros", nome:"Garras",             emoji:"🦴",raridade:"comum",   tipo:null,     stats:{hp:0, atk:12,def:0, spd:0 },descricao:"Laceram qualquer armadura."},
  membros_tentaculos:{id:"membros_tentaculos",slot:"membros",nome:"Tentáculos",        emoji:"🐙",raridade:"comum",   tipo:"veneno", stats:{hp:0, atk:8, def:3, spd:0 },descricao:"Imobilizam e envenenam."},
  membros_bracos:   {id:"membros_bracos",   slot:"membros", nome:"Braços Gigantes",    emoji:"💪",raridade:"comum",   tipo:null,     stats:{hp:5, atk:10,def:5, spd:0 },descricao:"Smash irresistível."},
  membros_laminas:  {id:"membros_laminas",  slot:"membros", nome:"Lâminas Afiadas",    emoji:"🗡️",raridade:"rara",    tipo:null,     stats:{hp:-5,atk:18,def:0, spd:5 },descricao:"Cortam o vento."},
  membros_garras_dragao:{id:"membros_garras_dragao",slot:"membros",nome:"Garras de Dragão",emoji:"🐲",raridade:"rara",tipo:"fogo",  stats:{hp:0, atk:20,def:0, spd:0 },descricao:"Incineram o que tocam."},
  asas_nenhuma:     {id:"asas_nenhuma",     slot:"asas",    nome:"Sem Asas",           emoji:"—", raridade:"comum",   tipo:null,     stats:{hp:0, atk:0, def:0, spd:0 },descricao:"Fica no chão."},
  asas_morcego:     {id:"asas_morcego",     slot:"asas",    nome:"Asas de Morcego",    emoji:"🦇",raridade:"comum",   tipo:"sombra", stats:{hp:0, atk:0, def:0, spd:10},descricao:"Rápido como a noite."},
  asas_anjo:        {id:"asas_anjo",        slot:"asas",    nome:"Asas de Anjo",       emoji:"👼",raridade:"comum",   tipo:"luz",    stats:{hp:15,atk:0, def:5, spd:0 },descricao:"Proteção divina."},
  asas_dragao:      {id:"asas_dragao",      slot:"asas",    nome:"Asas de Dragão",     emoji:"🐉",raridade:"rara",    tipo:"fogo",   stats:{hp:0, atk:5, def:0, spd:8 },descricao:"Voam e cospem fogo."},
  asas_fenix:       {id:"asas_fenix",       slot:"asas",    nome:"Asas de Fênix",      emoji:"🔥",raridade:"lendaria",tipo:"fogo",   stats:{hp:20,atk:0, def:0, spd:5 },descricao:"Ressuscita uma vez.",efeito:"ressurreicao"},
};
const SLOTS = ["cabeca","corpo","membros","asas"];

function calcularStats(ids){
  const s={...BASE};const ef=[];
  ids.forEach(id=>{const p=PECAS[id];if(!p)return;
    s.hp+=p.stats.hp;s.atk+=p.stats.atk;s.def+=p.stats.def;s.spd+=p.stats.spd;
    if(p.efeito&&!ef.includes(p.efeito))ef.push(p.efeito);
  });
  s.hp=Math.max(10,s.hp);s.atk=Math.max(1,s.atk);s.def=Math.max(0,s.def);s.spd=Math.max(1,s.spd);
  return{stats:s,efeitos:ef};
}

// ════════════════════════════════════════════════════════
//  DADOS: COMBOS
// ════════════════════════════════════════════════════════
const COMBOS=[
  {id:"dragao_puro",   nome:"Dragão Puro",       emoji:"🔥🐉",requer:["cabeca_dragao","membros_garras_dragao","asas_dragao"],    minMatch:3,bonus:{hp:50,atk:20,def:0,spd:0},efeitos:["fogo_persistente"]},
  {id:"rei_sombras",   nome:"Rei das Sombras",   emoji:"🌑👑", requer:["cabeca_cobra","corpo_aranha","asas_morcego"],             minMatch:3,bonus:{hp:10,atk:10,def:5,spd:10},efeitos:["veneno_permanente"]},
  {id:"cavaleiro",     nome:"Cavaleiro Sagrado",  emoji:"✨⚔️", requer:["corpo_cavaleiro","asas_anjo"],                           minMatch:2,bonus:{hp:30,atk:0,def:15,spd:0},efeitos:["escudo_sagrado"]},
  {id:"berserker",     nome:"Berserker Sombrio",  emoji:"😈💢", requer:["cabeca_demonio","corpo_demonio"],                        minMatch:2,bonus:{hp:0,atk:15,def:0,spd:5},efeitos:["berserk"]},
  {id:"tanque",        nome:"Tanque Ancestral",   emoji:"🧌🛡️", requer:["corpo_troll","membros_bracos"],                          minMatch:2,bonus:{hp:20,atk:5,def:5,spd:0},efeitos:["regeneracao"]},
  {id:"fenix_force",   nome:"Força da Fênix",     emoji:"🔥🌅", requer:["cabeca_fenix","asas_fenix"],                             minMatch:2,bonus:{hp:20,atk:10,def:0,spd:0},efeitos:["ressurreicao","fogo_persistente"]},
  {id:"assassino",     nome:"Assassino Veloz",    emoji:"⚡🗡️", requer:["cabeca_cobra","membros_laminas","asas_morcego"],         minMatch:3,bonus:{hp:0,atk:10,def:0,spd:20},efeitos:["veneno_permanente"]},
];
function verificarCombos(ids){
  const set=new Set(ids);
  return COMBOS.filter(c=>c.requer.filter(id=>set.has(id)).length>=c.minMatch);
}

//  MOTOR DE COMBATE
// ════════════════════════════════════════════════════════
function batalhar(mA,mB){
  const a=criarC(mA),b=criarC(mB);
  const log=[];
  log.push({t:"inicio",txt:`⚔️ ${a.nome} VS ${b.nome}`});
  log.push({t:"stats",a:{nome:a.nome,hp:a.hp},b:{nome:b.nome,hp:b.hp}});
  let[pri,seg]=a.spd>=b.spd?[a,b]:[b,a];
  for(let turno=1;turno<=40;turno++){
    log.push({t:"turno",turno});
    for(const[at,df]of[[pri,seg],[seg,pri]]){
      if(at.hp<=0||df.hp<=0)break;
      if(temEf(at,"regeneracao")){const c=5;at.hp=Math.min(at.maxHp,at.hp+c);log.push({t:"cura",nome:at.nome,v:c,hp:at.hp})}
      let dano=Math.max(1,at.atk-Math.floor(df.def*.5))+(Math.floor(Math.random()*5)-2);
      dano=Math.max(1,dano);
      if(temEf(at,"berserk")&&at.hp<at.maxHp*.5){dano=Math.floor(dano*1.5);log.push({t:"berserk",nome:at.nome})}
      df.hp-=dano;
      log.push({t:"ataque",at:at.nome,df:df.nome,dano,hpDf:Math.max(0,df.hp)});
      if(temEf(at,"veneno_permanente")||temEf(at,"veneno")){if(Math.random()<.5){adDot(df,{t:"veneno",turns:3,dano:4});log.push({t:"envenenado",nome:df.nome})}}
      if(temEf(at,"fogo_persistente")){if(Math.random()<.4){adDot(df,{t:"fogo",turns:2,dano:6});log.push({t:"queimando",nome:df.nome})}}
      for(const d of df.dots){if(d.turns<=0)continue;df.hp-=d.dano;d.turns--;log.push({t:"dot",ef:d.t,nome:df.nome,dano:d.dano,hp:Math.max(0,df.hp)})}
      df.dots=df.dots.filter(d=>d.turns>0);
      if(df.hp<=0){
        if(temEf(df,"ressurreicao")&&!df.ressuscitou){df.ressuscitou=true;df.hp=Math.floor(df.maxHp*.3);log.push({t:"ressurreicao",nome:df.nome,hp:df.hp})}
        else{log.push({t:"morte",nome:df.nome});const v=df===a?"b":"a";log.push({t:"fim",v:v==="a"?a.nome:b.nome});return{venc:v==="a"?mA.id:mB.id,log}}
      }
    }
  }
  const v=a.hp>=b.hp?a:b;
  log.push({t:"empate",txt:`Tempo! ${v.nome} vence por HP.`});
  log.push({t:"fim",v:v.nome});
  return{venc:v===a?mA.id:mB.id,log};
}
function criarC(m){return{nome:m.nome,id:m.id,hp:m.stats.hp,maxHp:m.stats.hp,atk:m.stats.atk,def:m.stats.def,spd:m.stats.spd,efeitos:[...(m.efeitos||[])],dots:[],ressuscitou:false}}
function temEf(c,ef){return c.efeitos.includes(ef)}
function adDot(c,d){const e=c.dots.find(x=>x.t===d.t);if(e)e.turns=Math.max(e.turns,d.turns);else c.dots.push({...d})}

];

];

let RUN = null;
function novaRun(nomeJogador){
  RUN={nomeJogador,rodada:0,monster:null,reliquias:[]};
}
function gerarInimigo(rodada){
  const isBoss=rodada%3===0;
  const mult=1+(rodada-1)*0.13*(isBoss?1.3:1);
  const zonaIdx=Math.min(Math.floor((rodada-1)/3),2);
  let nome,ids;
  if(isBoss){const b=BOSSES[Math.floor(rodada/3)-1];nome=b.nome;ids=b.pecas;}
  else{
    const rar=ZONAS[zonaIdx].raridades;
    const ns=["Chimera","Basilisco","Wyvern","Golem","Manticora","Gargoyle","Wendigo"];
    nome=ns[Math.floor(Math.random()*ns.length)];
    ids=SLOTS.map(sl=>{const pool=Object.values(PECAS).filter(p=>p.slot===sl&&rar.includes(p.raridade));return pool[Math.floor(Math.random()*pool.length)].id});
  }
  const{stats,efeitos}=calcularStats(ids);
  const combos=verificarCombos(ids);
  combos.forEach(c=>{stats.hp+=c.bonus.hp;stats.atk+=c.bonus.atk;stats.def+=c.bonus.def;stats.spd+=c.bonus.spd;c.efeitos.forEach(ef=>{if(!efeitos.includes(ef))efeitos.push(ef)})});
  const bm=isBoss?1.3:1;
  stats.hp=Math.max(10,Math.floor(stats.hp*mult*bm));stats.atk=Math.max(1,Math.floor(stats.atk*mult*bm));
  stats.def=Math.max(0,Math.floor(stats.def*mult*bm));stats.spd=Math.max(1,Math.floor(stats.spd*mult));
  const pecas={};ids.forEach(id=>{const p=PECAS[id];if(p)pecas[p.slot]=id});
  return{id:"inimigo",nome,pecas,stats,efeitos,combos,isBoss};
}
function gerarRecompensas(rodada,monster){
  const r=rodada,pool=[];
  pool.push({tipo:"stat_boost",stat:"hp", valor:15+r*3,emoji:"❤️",label:`+${15+r*3} Vida Máxima`});
  pool.push({tipo:"stat_boost",stat:"atk",valor:8+r*2, emoji:"⚔️",label:`+${8+r*2} Ataque`});
  pool.push({tipo:"stat_boost",stat:"def",valor:5+r,   emoji:"🛡️",label:`+${5+r} Defesa`});
  pool.push({tipo:"stat_boost",stat:"spd",valor:4+r,   emoji:"⚡",label:`+${4+r} Velocidade`});
  if(r>=2)pool.push({tipo:"full_heal",emoji:"💊",label:"+30 Vida"});
  const sl=SLOTS[Math.floor(Math.random()*SLOTS.length)];
  const rp=Object.values(PECAS).filter(p=>p.slot===sl&&(p.raridade==="rara"||p.raridade==="lendaria"));
  if(rp.length){const np=rp[Math.floor(Math.random()*rp.length)];pool.push({tipo:"peca_swap",slot:sl,emoji:np.emoji,label:`Nova ${sl}: ${np.nome}`,peca:np})}
  if(r>=2){const disp=RELIQUIAS.filter(rl=>!monster.reliquias.includes(rl.id));if(disp.length){const rl=disp[Math.floor(Math.random()*disp.length)];pool.push({tipo:"reliquia",emoji:rl.emoji,label:rl.nome,desc:rl.desc,reliquia:rl})}}
  return pool.sort(()=>Math.random()-.5).slice(0,3);
}
function aplicarRecompensa(monster,r){
  const s=monster.stats;
  if(r.tipo==="stat_boost")s[r.stat]+=r.valor;
  else if(r.tipo==="full_heal")s.hp+=30;
  else if(r.tipo==="peca_swap"){
    const v=PECAS[monster.pecas[r.slot]],n=r.peca;
    if(v){s.hp-=v.stats.hp;s.atk-=v.stats.atk;s.def-=v.stats.def;s.spd-=v.stats.spd}
    if(n){s.hp+=n.stats.hp;s.atk+=n.stats.atk;s.def+=n.stats.def;s.spd+=n.stats.spd}
    s.hp=Math.max(10,s.hp);s.atk=Math.max(1,s.atk);s.def=Math.max(0,s.def);s.spd=Math.max(1,s.spd);
    monster.pecas[r.slot]=r.peca.id;
  }else if(r.tipo==="reliquia"){
    monster.reliquias.push(r.reliquia.id);
    if(r.reliquia.ef&&!monster.efeitos.includes(r.reliquia.ef))monster.efeitos.push(r.reliquia.ef);
  }
}

function atualizarPrevDraft(){
  const ids=Object.values(draftSelecoes).filter(Boolean);

// Combate
let hpMaxA=1,hpMaxB=1;
function iniciarCombate(){
  const res=batalhar(RUN.monster,inimigoAtual);
  el("fn-a").textContent=RUN.monster.nome;
  el("fn-b").textContent=inimigoAtual.nome;
  hpMaxA=RUN.monster.stats.hp;hpMaxB=inimigoAtual.stats.hp;
  el("hpb-a").style.width="100%";el("hpb-b").style.width="100%";
  el("hpb-a").classList.remove("low");el("hpb-b").classList.remove("low");
  el("log").innerHTML="";
  mostrar("t-combate");
  let delay=0;
  res.log.forEach(e=>{delay+=velLog(e);setTimeout(()=>renderLog(e),delay)});
  const totalDelay=delay+600;
  setTimeout(()=>{
    if(res.venc===RUN.monster.id){mostrarRecompensa()}
    else{mostrarGameOver()}
  },totalDelay);
}
function velLog(e){if(e.t==="turno")return 170;if(e.t==="inicio"||e.t==="fim")return 320;return 90}
function renderLog(e){
  const d=el("log");const l=document.createElement("div");l.className="ll";
  if(e.t==="inicio"){l.className+=" li";l.textContent=e.txt}
  else if(e.t==="turno"){l.className+=" lt";l.textContent=`— Turno ${e.turno} —`}
  else if(e.t==="ataque"){l.className+=" la";l.innerHTML=`<b>${e.at}</b> ataca → <span class="ld">-${e.dano} HP</span> (${e.df}: ${e.hpDf} HP)`;atuBarraHP(e.df,e.hpDf)}
  else if(e.t==="cura"){l.className+=" lc";l.textContent=`🌿 ${e.nome} regenera +${e.v} HP (${e.hp} HP)`}
  else if(e.t==="envenenado"){l.className+=" le";l.textContent=`🐍 ${e.nome} envenenado!`}
  else if(e.t==="queimando"){l.className+=" le";l.textContent=`🔥 ${e.nome} em chamas!`}
  else if(e.t==="dot"){l.className+=" ld";l.textContent=`${e.ef==="veneno"?"🐍":"🔥"} ${e.nome} sofre ${e.dano} (${e.hp} HP)`;atuBarraHP(e.nome,e.hp)}
  else if(e.t==="berserk"){l.className+=" lb";l.textContent=`💢 ${e.nome} BERSERK!`}
  else if(e.t==="ressurreicao"){l.className+=" le";l.textContent=`🔥 ${e.nome} renasce! (${e.hp} HP)`}
  else if(e.t==="morte"){l.className+=" lm";l.textContent=`💀 ${e.nome} derrotado!`}
  else if(e.t==="fim"){l.className+=" lf";l.textContent=`🏆 ${e.v} venceu!`}
  else if(e.t==="empate"){l.className+=" lf";l.textContent=e.txt}
  else return;
  d.appendChild(l);d.scrollTop=d.scrollHeight;
}
function atuBarraHP(nome,hp){
  let fill,max;
  if(nome===RUN.monster.nome){fill=el("hpb-a");max=hpMaxA}
  else if(nome===inimigoAtual.nome){fill=el("hpb-b");max=hpMaxB}
  else return;
  const pct=Math.max(0,Math.min(100,(hp/max)*100));
  fill.style.width=pct+"%";
  if(pct<30)fill.classList.add("low");else fill.classList.remove("low");
}

      <div class="st"><span class="sl">⚡ Velocidade</span><span>${m.stats.spd}</span></div>
    </div>
    ${m.reliquias.length?`<div class="rel-lista" style="margin-top:10px">${m.reliquias.map(id=>{const r=RELIQUIAS.find(x=>x.id===id);return r?`<span class="rel-pip">${r.emoji} ${r.nome}</span>`:""}).join("")}</div>`:""}`;
  mostrar("t-over");
}
el("btn-over").addEventListener("click",()=>location.reload());

// Vitória
function mostrarVitoria(){
  const m=RUN.monster;
  el("win-monster").innerHTML=`<div class="mcard-nome">${m.nome}</div>
    <div class="mcard-stats" style="margin-top:10px">
      <div class="st"><span class="sl">❤️ Vida</span><span>${m.stats.hp}</span></div>
      <div class="st"><span class="sl">⚔️ Ataque</span><span>${m.stats.atk}</span></div>
      <div class="st"><span class="sl">🛡️ Defesa</span><span>${m.stats.def}</span></div>
      <div class="st"><span class="sl">⚡ Velocidade</span><span>${m.stats.spd}</span></div>
    </div>
    ${m.reliquias.length?`<div class="rel-lista" style="margin-top:10px">${m.reliquias.map(id=>{const r=RELIQUIAS.find(x=>x.id===id);return r?`<span class="rel-pip">${r.emoji} ${r.nome}</span>`:""}).join("")}</div>`:""}`;
  mostrar("t-win");
}
el("btn-win").addEventListener("click",()=>location.reload());
</script>
